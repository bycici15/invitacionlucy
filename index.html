<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cumpleaños Claudia Lucy y Rosalba</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5e6e8;
      font-family: Georgia, serif;
    }

    .card {
      position: relative;
      width: 393px;
      min-height: 700px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.18);
    }

    /* ── Background image ── */
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* ── Overlay layer for interactive elements ── */
    .overlay {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 54px;
    }

    /* ── Music Player ── */
    .player {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(6px);
      border-radius: 40px;
      padding: 6px 18px 6px 10px;
      box-shadow: 0 2px 12px rgba(180,100,100,0.13);
    }

    .player-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #c8a96e;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .player-btn:hover { background: #b08855; transform: scale(1.08); }

    .player-track {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .track-label {
      font-size: 10px;
      color: #b08855;
      letter-spacing: 0.06em;
      font-style: italic;
    }
    .progress-bar {
      width: 110px;
      height: 3px;
      background: #e8cfa0;
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #c8a96e, #e0c080);
      border-radius: 99px;
      transition: width 0.4s linear;
    }

    /* ── Ubicación Button ── */
    .ubicacion-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 13px 36px;
      border: 2px solid #c8a96e;
      border-radius: 40px;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(4px);
      color: #9a7040;
      font-size: 13px;
      font-family: Georgia, serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.22s, transform 0.16s, box-shadow 0.22s;
      box-shadow: 0 4px 18px rgba(180,130,60,0.18);
    }
    .ubicacion-btn:hover {
      background: #c8a96e;
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(180,130,60,0.32);
    }
    .ubicacion-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      fill: currentColor;
      transition: fill 0.22s;
    }

    /* pulse animation on load */
    @keyframes pulse-in {
      0%   { transform: scale(0.92); opacity: 0; }
      60%  { transform: scale(1.04); }
      100% { transform: scale(1);    opacity: 1; }
    }
    .ubicacion-btn { animation: pulse-in 0.6s ease 0.4s both; }
  </style>
</head>
<body>

<div class="card">
  <!-- Background: replace src with your image path or base64 -->
  <img class="bg" src="fondoM.jpg" alt="Invitación cumpleaños" />

  <div class="overlay">

    <!-- ── Music Player ── -->
    <div class="player">
      <button class="player-btn" id="playBtn" aria-label="Reproducir / Pausar">
        <!-- Play icon -->
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" id="playIcon">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <!-- Pause icon (hidden) -->
        <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14" id="pauseIcon" style="display:none">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>

      <div class="player-track">
        <span class="track-label">♪</span>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <!-- ── Ubicación Button ── -->
    <a
      class="ubicacion-btn"
      href="https://www.google.com/maps/search/La+Cabaña+Misiones"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Ver ubicación en Google Maps"
    >
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z"/></svg>
      Ubicación
    </a>

  </div>
</div>

<!-- Audio: replace src with your audio file URL -->
<audio id="bgAudio" loop preload="auto">
  <source src="audio.mp3" type="audio/mpeg" />
  <!-- You can also use an online URL, e.g.: -->
  <!-- <source src="https://www.example.com/music.mp3" type="audio/mpeg" /> -->
</audio>

<script>
  const audio        = document.getElementById('bgAudio');
  const playBtn      = document.getElementById('playBtn');
  const playIcon     = document.getElementById('playIcon');
  const pauseIcon    = document.getElementById('pauseIcon');
  const progressFill = document.getElementById('progressFill');
  const progressBar  = document.getElementById('progressBar');

  function updateIcons(playing) {
    playIcon.style.display  = playing ? 'none'  : 'block';
    pauseIcon.style.display = playing ? 'block' : 'none';
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play().catch(() => {});
      updateIcons(true);
    } else {
      audio.pause();
      updateIcons(false);
    }
  });

  // Progress bar update
  audio.addEventListener('timeupdate', () => {
    if (audio.duration) {
      const pct = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = pct + '%';
    }
  });

  // Seek on click
  progressBar.addEventListener('click', (e) => {
    const rect = progressBar.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if (audio.duration) audio.currentTime = ratio * audio.duration;
  });
</script>

</body>
</html>
